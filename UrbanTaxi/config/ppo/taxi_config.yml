behaviors:
  AgenteTaxi:
    trainer_type: ppo

    hyperparameters:
      batch_size: 512
      buffer_size: 5120
      learning_rate: 3.0e-4
      beta: 5.0e-4
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 2
    

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 3.0e6
    time_horizon: 64
    summary_freq: 1000

engine_settings:
  time_scale: 5
  target_frame_rate: -1
  capture_frame_rate: 60
